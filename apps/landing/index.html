<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Handcrafted pizzas and Italian favourites for direct pickup from Pizza Avenue, Sainikpuri."
    />
    <meta name="theme-color" content="#FDF6E9" />
    <link rel="preload" as="image" href="/assets/logo/pizza%20avenue.jpeg" />
    <link rel="icon" type="image/jpeg" href="/assets/logo/pizza%20avenue.jpeg" />
    <link rel="apple-touch-icon" href="/assets/logo/pizza%20avenue.jpeg" />
    <title>Pizza Avenue — Handcrafted Pizza in Sainikpuri</title>
    <style>
      #page-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #fdf6e9;
        opacity: 1;
        transition: opacity 280ms ease;
      }

      #page-loader.is-complete {
        opacity: 0;
        pointer-events: none;
      }

      .page-loader__content {
        display: grid;
        justify-items: center;
        gap: clamp(1.5rem, 4vw, 2.25rem);
        width: min(72vw, 20rem);
      }

      .page-loader__logo {
        display: block;
        width: min(100%, 16rem);
        height: auto;
        aspect-ratio: 1;
        border-radius: 50%;
      }

      .page-loader__track {
        display: block;
        width: 100%;
        height: 3px;
        overflow: hidden;
        background: #eadcc8;
      }

      .page-loader__track::after {
        content: '';
        display: block;
        width: 38%;
        height: 100%;
        background: #6b1f1f;
        animation: page-loader-progress 1.35s ease-in-out infinite;
      }

      .page-loader__label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      @keyframes page-loader-progress {
        from { transform: translateX(-100%); }
        to { transform: translateX(265%); }
      }

      @media (prefers-reduced-motion: reduce) {
        #page-loader { transition: none; }
        .page-loader__track::after { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="page-loader" role="status" aria-live="polite">
      <div class="page-loader__content">
        <img class="page-loader__logo" src="/assets/logo/pizza%20avenue.jpeg" alt="Pizza Avenue" width="256" height="256" fetchpriority="high" />
        <span class="page-loader__track" aria-hidden="true"></span>
        <span class="page-loader__label">Loading Pizza Avenue</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
